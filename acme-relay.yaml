server:
  host: "0.0.0.0"
  port: 8080

acme:
  provider: "letsencrypt"
  email: "admin@example.com"

dns:
  provider: "cloudflare"
  credentials:
    CLOUDFLARE_DNS_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN}"
  # Zones the DNS TXT API (/api/v1/dns/txt/*) may write into. The API only
  # accepts _acme-challenge.* names inside these zones, and stays disabled
  # unless both allowedZones and apiTokens are configured.
  # Supported providers: alidns, cloudflare.
  # allowedZones:
  #   - "example.com"

storage:
  type: "filesystem"
  path: "/var/lib/acme-relay/certs"

# Other provider examples
#
# AliDNS (Aliyun)
# dns:
#   provider: "alidns"
#   credentials:
#     ALICLOUD_ACCESS_KEY: "${ALICLOUD_ACCESS_KEY}"
#     ALICLOUD_SECRET_KEY: "${ALICLOUD_SECRET_KEY}"
#   allowedZones:
#     - "example.com"
#
# Bearer tokens for the DNS TXT API (used by plugins/dns_acmerelay.sh)
# apiTokens:
#   - token: "${ACMERELAY_API_KEY}"
#     description: "portal acme.sh"
#
# Route 53
# dns:
#   provider: "route53"
#   credentials:
#     AWS_ACCESS_KEY_ID: "..."
#     AWS_SECRET_ACCESS_KEY: "..."
#     AWS_REGION: "us-east-1"
#
# DigitalOcean
# dns:
#   provider: "digitalocean"
#   credentials:
#     DO_AUTH_TOKEN: "..."
