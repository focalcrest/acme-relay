server:
  host: "0.0.0.0"
  port: 8080

acme:
  provider: "letsencrypt"
  email: "admin@example.com"

dns:
  provider: "cloudflare"
  credentials:
    CLOUDFLARE_DNS_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN}"

storage:
  type: "filesystem"
  path: "/var/lib/acme-relay/certs"

