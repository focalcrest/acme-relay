server:
  host: "0.0.0.0"
  port: 8080

acme:
  provider: "letsencrypt"
  email: "admin@example.com"

dns:
  provider: "alidns"
  credentials:
    ALICLOUD_ACCESS_KEY: "${ALIDNS_ACCESS_KEY}"
    ALICLOUD_SECRET_KEY: "${ALIDNS_SECRET_KEY}"

storage:
  type: "filesystem"
  path: "/var/lib/acme-relay/certs"

